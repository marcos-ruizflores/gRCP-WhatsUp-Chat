syntax = "proto3";

service ChatService {
  rpc sendMessage(Message) returns (SendResponse);
  rpc getMessages(Empty) returns (MessageList);
}

message Message {
  string nickname = 1;
  string text = 2;
}

message SendResponse {
  bool ok = 1;
}

message MessageList {
  repeated string lines = 1;
}

message Empty {}
